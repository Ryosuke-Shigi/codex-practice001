name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Check changed PHP formatting
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t php_files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.php')

          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "No PHP files changed; skipping Pint."
            exit 0
          fi

          printf 'Changed PHP files:\n'
          printf '%s\n' "${php_files[@]}"
          composer format-check -- "${php_files[@]}"

      - name: Check PHP formatting
        if: github.event_name != 'pull_request'
        run: composer format-check

      - name: Build frontend assets
        run: npm run build

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run Laravel tests
        run: php artisan test

      - name: Run Vitest
        env:
          # Vitest resolves Vite config in CI; this bypasses Laravel's HMR-only guard for that test runner path.
          LARAVEL_BYPASS_ENV_CHECK: 1
        run: npm run test:run
