name: Deploy to Lightsail

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build frontend assets
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run Vite build on GitHub runner
        run: |
          set -e
          # Build on the GitHub runner, not on Lightsail. The Lightsail instance is
          # small, so production deploy must only receive already-built assets.
          npm ci
          npm run build
          tar -czf /tmp/api-discovery-hub-public-build.tar.gz -C public build

      - name: Deploy via SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          echo "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key

          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/lightsail_key \
            /tmp/api-discovery-hub-public-build.tar.gz \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/tmp/api-discovery-hub-public-build.tar.gz"

          ssh -i ~/.ssh/lightsail_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" << 'EOF'
            set -e

            cd /var/www/api-discovery-hub/src
            git status --short
            git fetch origin main
            git checkout ${{ github.event.workflow_run.head_sha }}

            rm -rf public/build
            mkdir -p public
            tar -xzf /tmp/api-discovery-hub-public-build.tar.gz -C public

            cd /var/www/api-discovery-hub

            docker compose exec -T php-fpm php artisan optimize:clear

            # API catalog manual sync is queued, so deploying only php-fpm is not enough.
            # Keep queue/scheduler containers present and restart them so they pick up
            # the newly pulled Laravel code and the latest optimized cache state.
            # Migrations are intentionally not executed here; production DB changes are
            # applied by a human decision with `php artisan migrate --force`.
            docker compose up -d queue scheduler
            docker compose restart php-fpm queue scheduler

            docker compose ps
            curl -I http://127.0.0.1/
          EOF
